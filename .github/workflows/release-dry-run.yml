# Release dry-run (ADR-0014) — manual dispatch, publishes NOTHING.
#
# Runs the exact build + smoke + checksum-assertion steps of release.yml for
# one target (or `all`), minus every publish action: this workflow has no
# write permissions, no gh-release step, and no artifact uploads. The pairing
# is enforced textually by tests/release-discipline.test.ts (any release-
# creating action appearing here fails CI).
#
# The always-on, push-triggered counterpart is the `release-dry-run` job in
# ci.yml (macOS arm64 only, native build, fast).

name: Release dry-run

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which target to exercise (all = full matrix)"
        type: choice
        default: macos-arm64
        options:
          - macos-arm64
          - macos-x64
          - linux-x64
          - linux-arm64
          - all

permissions: {} # nothing published, nothing uploaded

jobs:
  build:
    name: dry-run void-${{ matrix.name }}
    if: ${{ matrix.name == inputs.target || inputs.target == 'all' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            bun_target: bun-darwin-arm64
            smoke: native
          - name: macos-x64
            runner: macos-latest
            bun_target: bun-darwin-x64
            smoke: rosetta
          - name: linux-x64
            runner: ubuntu-latest
            bun_target: bun-linux-x64
            smoke: native
          - name: linux-arm64
            runner: ubuntu-latest
            bun_target: bun-linux-arm64
            smoke: qemu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build dist/void-${{ matrix.name }} (sync-prompt + targeted compile)
        run: |
          bun run sync-prompt
          bun build --compile --target=${{ matrix.bun_target }} src/cli.ts --outfile "dist/void-${{ matrix.name }}"
      - name: Smoke test (native)
        if: matrix.smoke == 'native'
        run: "./dist/void-${{ matrix.name }} --version"
      - name: Smoke test (Rosetta 2)
        if: matrix.smoke == 'rosetta'
        run: |
          arch -x86_64 /usr/bin/true || { echo "Rosetta 2 unavailable on this runner — cannot smoke-test the x64 build" >&2; exit 1; }
          arch -x86_64 "./dist/void-${{ matrix.name }}" --version
      - name: Install qemu-user-static (linux-arm64 leg only)
        if: matrix.smoke == 'qemu'
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Smoke test (qemu-aarch64)
        if: matrix.smoke == 'qemu'
        run: qemu-aarch64-static "./dist/void-${{ matrix.name }}" --version
      - name: Generate SHA256SUMS for this target
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "void-${{ matrix.name }}" > SHA256SUMS
          else
            shasum -a 256 "void-${{ matrix.name }}" > SHA256SUMS
          fi
          cat SHA256SUMS
      - name: Assert naming + checksum format + digest match (no release created)
        run: bash scripts/assert-release-artifact.sh "dist/void-${{ matrix.name }}" dist/SHA256SUMS
